<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09_KineticRibbon — Parametric Wave</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0A0A; }
        #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const isMobile = window.innerWidth < 768;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = isMobile ? 6.5 : 5.0;

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Curva Matemática (Trefoil Knot)
        class TrefoilCurve extends THREE.Curve {
            constructor(scale = 1) { super(); this.scale = scale; }
            getPoint(t, optionalTarget = new THREE.Vector3()) {
                const tau = t * Math.PI * 2;
                const x = Math.sin(tau) + 2 * Math.sin(2 * tau);
                const y = Math.cos(tau) - 2 * Math.cos(2 * tau);
                const z = -Math.sin(3 * tau);
                return optionalTarget.set(x, y, z).multiplyScalar(this.scale * 0.45);
            }
        }

        const path = new TrefoilCurve(1.5);
        const geometry = new THREE.TubeGeometry(path, isMobile ? 120 : 250, 0.12, isMobile ? 16 : 32, true);

        const material = new THREE.MeshStandardMaterial({
            color: 0x111111,
            roughness: 0.15,
            metalness: 0.9,
            wireframe: false
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Iluminación Neon de borde
        const light1 = new THREE.PointLight(0x00E5FF, 25, 10);
        light1.position.set(2, 3, 2);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xFF0055, 20, 10);
        light2.position.set(-2, -3, -2);
        scene.add(light2);

        const ambLight = new THREE.AmbientLight(0x050505);
        scene.add(ambLight);

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;

            mesh.rotation.x = Math.sin(time * 0.5) * 0.4;
            mesh.rotation.y = time * 0.3;

            light1.position.x = Math.sin(time * 1.5) * 3;
            light1.position.z = Math.cos(time * 1.5) * 3;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
