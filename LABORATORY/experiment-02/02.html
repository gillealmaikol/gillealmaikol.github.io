<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbitron — Particle Blob</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0A0A0A;
        }

        #blob-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="blob-canvas"></canvas>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
    </script>

    <script type="module">
      import * as THREE from 'three';

      // ====================== NOISE ======================
      function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
      function lerp(a, b, t) { return a + t * (b - a); }
      function grad(hash, x, y, z) {
        const h = hash & 15;
        const u = h < 8 ? x : y;
        const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }

      const perm = new Uint8Array(512);
      const p = new Uint8Array(256);
      for (let i = 0; i < 256; i++) p[i] = i;
      for (let i = 255; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [p[i], p[j]] = [p[j], p[i]];
      }
      for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

      function noise3D(x, y, z) {
        const X = Math.floor(x) & 255;
        const Y = Math.floor(y) & 255;
        const Z = Math.floor(z) & 255;
        x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
        const u = fade(x), v = fade(y), w = fade(z);
        const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
        const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;

        return lerp(
          lerp(
            lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
            lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u),
            v
          ),
          lerp(
            lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
            lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u),
            v
          ),
          w
        );
      }

      // ====================== SCENE ======================
      const canvas = document.getElementById('blob-canvas');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 6.2;

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x0A0A0A, 1);   // fondo #0A0A0A

      // ====================== PARTICLES ======================
      const COUNT = 14000;

      function getRadius() {
        if (window.innerWidth < 768) return 1.15;
        else if (window.innerWidth < 1200) return 1.45;
        else return 1.70;
      }

      let RADIUS = getRadius();

      const positions = new Float32Array(COUNT * 3);
      const colors = new Float32Array(COUNT * 3);
      const original = new Float32Array(COUNT * 3);

      const cyanBright = new THREE.Color(0x00e5ff);
      const cyanDim    = new THREE.Color(0x00a8b3);
      const magenta    = new THREE.Color(0xff2a6d);
      const magentaDim = new THREE.Color(0xb31e4d);

      for (let i = 0; i < COUNT; i++) {
        const phi = Math.acos(1 - 2 * (i + 0.5) / COUNT);
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;

        const x = Math.sin(phi) * Math.cos(theta);
        const y = Math.sin(phi) * Math.sin(theta);
        const z = Math.cos(phi);

        positions[i * 3]     = x * RADIUS;
        positions[i * 3 + 1] = y * RADIUS;
        positions[i * 3 + 2] = z * RADIUS;

        original[i * 3]     = x;
        original[i * 3 + 1] = y;
        original[i * 3 + 2] = z;

        const t = (y + 1) * 0.5;
        let c;
        if (t < 0.33) {
          c = cyanBright.clone().lerp(cyanDim, t / 0.33);
        } else if (t < 0.66) {
          c = cyanDim.clone().lerp(magentaDim, (t - 0.33) / 0.33);
        } else {
          c = magentaDim.clone().lerp(magenta, (t - 0.66) / 0.34);
        }

        colors[i * 3]     = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.026,
        vertexColors: true,
        transparent: true,
        opacity: 0.72,
        sizeAttenuation: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geometry, material);
      scene.add(points);

      // ====================== ANIMATION ======================
      let time = 0;

      function animate() {
        requestAnimationFrame(animate);
        time += 0.0055;

        const pos = geometry.attributes.position.array;

        for (let i = 0; i < COUNT; i++) {
          const ox = original[i * 3];
          const oy = original[i * 3 + 1];
          const oz = original[i * 3 + 2];

          const n1 = noise3D(ox * 1.35 + time, oy * 1.35, oz * 1.35) * 0.32;
          const n2 = noise3D(ox * 2.6 - time * 0.6, oy * 2.6, oz * 2.6) * 0.14;
          const n3 = noise3D(ox * 0.65 + time * 0.25, oy * 0.65, oz * 0.65) * 0.22;

          const displacement = 1 + n1 + n2 + n3;

          pos[i * 3]     = ox * RADIUS * displacement;
          pos[i * 3 + 1] = oy * RADIUS * displacement;
          pos[i * 3 + 2] = oz * RADIUS * displacement;
        }

        geometry.attributes.position.needsUpdate = true;
        points.rotation.y = time * 0.12;
        points.rotation.x = Math.sin(time * 0.09) * 0.07;

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        RADIUS = getRadius();
      });
    </script>
</body>
</html>
