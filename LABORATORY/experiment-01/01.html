<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core_AttractorSystem_v8 — Chaotic Strange Attractor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0A0A0A;
        }
        #attractor-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="attractor-canvas"></canvas>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
    </script>

    <script type="module">
      import * as THREE from 'three';

      // ====================== SCENE SETUP ======================
      const canvas = document.getElementById('attractor-canvas');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 5.8);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x0A0A0A, 1);

      // Scale factor para ajustar el atractor en pantalla
      function getScale() {
        if (window.innerWidth < 768) return 1.1;
        else if (window.innerWidth < 1200) return 1.45;
        else return 1.75;
      }
      let SCALE = getScale();

      // ====================== AIZAWA ATTRACTOR SYSTEM ======================
      const COUNT = 22000;
      const positions = new Float32Array(COUNT * 3);
      const colors = new Float32Array(COUNT * 3);
      
      // Guardar estados (x, y, z) de cada partícula en memoria local
      const particleStates = new Float32Array(COUNT * 3);
      const particleLife = new Float32Array(COUNT);

      // Parámetros del Atractor de Aizawa
      const a = 0.95;
      const b = 0.7;
      const c = 0.6;
      const d = 3.5;
      const e = 0.25;
      const f = 0.1;
      const dt = 0.012; // Paso de integración temporal (Euler)

      // Paleta: Neón Cyan -> Magenta Eléctrico -> Fuego Naranja -> Oro Caótico
      const colorA = new THREE.Color(0x00F0FF);
      const colorB = new THREE.Color(0xFF007F);
      const colorC = new THREE.Color(0xFF5500);
      const colorD = new THREE.Color(0xFFD700);

      function resetParticle(i) {
        const idx = i * 3;
        // Iniciar cerca del centro con pequeñas variaciones aleatorias
        const px = (Math.random() - 0.5) * 0.2;
        const py = (Math.random() - 0.5) * 0.2;
        const pz = (Math.random() - 0.5) * 0.2 + 0.1;

        particleStates[idx]     = px;
        particleStates[idx + 1] = py;
        particleStates[idx + 2] = pz;

        positions[idx]     = px * SCALE;
        positions[idx + 1] = py * SCALE;
        positions[idx + 2] = pz * SCALE;

        particleLife[i] = Math.floor(Math.random() * 400 + 200);

        // Asignar color base según el radio
        const dist = Math.sqrt(px * px + py * py + pz * pz);
        let col = colorA.clone().lerp(colorB, Math.min(1, dist * 0.8));

        colors[idx]     = col.r;
        colors[idx + 1] = col.g;
        colors[idx + 2] = col.b;
      }

      for (let i = 0; i < COUNT; i++) {
        resetParticle(i);
        // Desfasar ciclos de vida iniciales
        particleLife[i] = Math.floor(Math.random() * 500);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.02,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const attractorSystem = new THREE.Points(geometry, material);
      scene.add(attractorSystem);

      // ====================== ANIMATION LOOP ======================
      let time = 0;

      function animate() {
        requestAnimationFrame(animate);
        time += 0.005;

        const pos = geometry.attributes.position.array;
        const cols = geometry.attributes.color.array;

        for (let i = 0; i < COUNT; i++) {
          const idx = i * 3;

          let x = particleStates[idx];
          let y = particleStates[idx + 1];
          let z = particleStates[idx + 2];

          // 1. Integración de Ecuaciones Diferenciales (Aizawa Attractor)
          const dx = (z - b) * x - d * y;
          const dy = d * x + (z - b) * y;
          const dz = c + a * z - (z * z * z) / 3.0 - (x * x + y * y) * (1.0 + e * z) + f * z * (x * x * x);

          x += dx * dt;
          y += dy * dt;
          z += dz * dt;

          particleStates[idx]     = x;
          particleStates[idx + 1] = y;
          particleStates[idx + 2] = z;

          // 2. Escalar para renderizado
          pos[idx]     = x * SCALE;
          pos[idx + 1] = y * SCALE;
          pos[idx + 2] = (z - 0.5) * SCALE; // Centrar en origen Z

          // 3. Modificación Dinámica de Color basada en Z y distancia
          const dist = Math.sqrt(x * x + y * y + z * z);
          const normZ = (z + 0.5) * 0.5;

          let cObj;
          if (normZ < 0.33) {
            cObj = colorA.clone().lerp(colorB, normZ / 0.33);
          } else if (normZ < 0.66) {
            cObj = colorB.clone().lerp(colorC, (normZ - 0.33) / 0.33);
          } else {
            cObj = colorC.clone().lerp(colorD, Math.min(1, (normZ - 0.66) / 0.34));
          }

          cols[idx]     = cObj.r;
          cols[idx + 1] = cObj.g;
          cols[idx + 2] = cObj.b;

          // Reciclar partícula si muere
          particleLife[i]--;
          if (particleLife[i] <= 0) {
            resetParticle(i);
          }
        }

        geometry.attributes.position.needsUpdate = true;
        geometry.attributes.color.needsUpdate = true;

        // Rotación orbital constante de la estructura caótica
        attractorSystem.rotation.y = time * 0.2;
        attractorSystem.rotation.x = Math.sin(time * 0.1) * 0.15;

        renderer.render(scene, camera);
      }

      animate();

      // ====================== RESIZE ======================
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        SCALE = getScale();
      });
    </script>
</body>
</html>
