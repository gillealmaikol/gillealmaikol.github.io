<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core & Aura Particle System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000; /* Fondo negro puro */
        }

        #particle-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
    </script>

    <script type="module">
      import * as THREE from 'three';

      // ====================== NOISE FUNCTION ======================
      function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
      function lerp(a, b, t) { return a + t * (b - a); }
      function grad(hash, x, y, z) {
        const h = hash & 15;
        const u = h < 8 ? x : y;
        const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }

      const perm = new Uint8Array(512);
      const p = new Uint8Array(256);
      for (let i = 0; i < 256; i++) p[i] = i;
      for (let i = 255; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [p[i], p[j]] = [p[j], p[i]];
      }
      for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

      function noise3D(x, y, z) {
        const X = Math.floor(x) & 255;
        const Y = Math.floor(y) & 255;
        const Z = Math.floor(z) & 255;
        x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
        const u = fade(x), v = fade(y), w = fade(z);
        const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
        const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;

        return lerp(
          lerp(
            lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
            lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u),
            v
          ),
          lerp(
            lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
            lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u),
            v
          ),
          w
        );
      }

      // ====================== SCENE SETUP ======================
      const canvas = document.getElementById('particle-canvas');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 6.0;

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 1);

      // ====================== TEXTURA DE PARTICULA (SOFT GLOW) ======================
      function createParticleTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
        gradient.addColorStop(0.7, 'rgba(255, 255, 255, 0.15)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);

        const texture = new THREE.CanvasTexture(canvas);
        return texture;
      }

      const particleTexture = createParticleTexture();

      // ====================== NÚCLEO (CORE) ======================
      const CORE_COUNT = 8000;
      const CORE_RADIUS = 0.85;

      const corePositions = new Float32Array(CORE_COUNT * 3);
      const coreOriginal = new Float32Array(CORE_COUNT * 3);

      for (let i = 0; i < CORE_COUNT; i++) {
        // Distribución en volumen esférico denso
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = Math.cbrt(Math.random()) * CORE_RADIUS;

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta);
        const z = r * Math.cos(phi);

        corePositions[i * 3]     = x;
        corePositions[i * 3 + 1] = y;
        corePositions[i * 3 + 2] = z;

        coreOriginal[i * 3]     = x;
        coreOriginal[i * 3 + 1] = y;
        coreOriginal[i * 3 + 2] = z;
      }

      const coreGeometry = new THREE.BufferGeometry();
      coreGeometry.setAttribute('position', new THREE.BufferAttribute(corePositions, 3));

      const coreMaterial = new THREE.PointsMaterial({
        size: 0.038,
        map: particleTexture,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const corePoints = new THREE.Points(coreGeometry, coreMaterial);
      scene.add(corePoints);

      // ====================== AURA EXTERIOR (AURA / RING) ======================
      const AURA_COUNT = 10000;
      const AURA_MIN_RADIUS = 1.35;
      const AURA_MAX_RADIUS = 2.10;

      const auraPositions = new Float32Array(AURA_COUNT * 3);
      const auraOriginal = new Float32Array(AURA_COUNT * 3);

      for (let i = 0; i < AURA_COUNT; i++) {
        const phi = Math.acos(1 - 2 * (i + 0.5) / AURA_COUNT);
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;

        // Distribución dispersa en capa externa
        const r = AURA_MIN_RADIUS + Math.random() * (AURA_MAX_RADIUS - AURA_MIN_RADIUS);

        const x = Math.sin(phi) * Math.cos(theta) * r;
        const y = Math.sin(phi) * Math.sin(theta) * r;
        const z = Math.cos(phi) * r;

        auraPositions[i * 3]     = x;
        auraPositions[i * 3 + 1] = y;
        auraPositions[i * 3 + 2] = z;

        auraOriginal[i * 3]     = x;
        auraOriginal[i * 3 + 1] = y;
        auraOriginal[i * 3 + 2] = z;
      }

      const auraGeometry = new THREE.BufferGeometry();
      auraGeometry.setAttribute('position', new THREE.BufferAttribute(auraPositions, 3));

      const auraMaterial = new THREE.PointsMaterial({
        size: 0.024,
        map: particleTexture,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const auraPoints = new THREE.Points(auraGeometry, auraMaterial);
      scene.add(auraPoints);

      // ====================== ANIMACIÓN & MOVIEMIENTO ======================
      let time = 0;

      function animate() {
        requestAnimationFrame(animate);
        time += 0.006;

        // --- Deformación del Núcleo ---
        const corePos = coreGeometry.attributes.position.array;
        for (let i = 0; i < CORE_COUNT; i++) {
          const ox = coreOriginal[i * 3];
          const oy = coreOriginal[i * 3 + 1];
          const oz = coreOriginal[i * 3 + 2];

          const noiseVal = noise3D(ox * 2.5 + time, oy * 2.5 + time, oz * 2.5);
          const disp = 1 + noiseVal * 0.28;

          corePos[i * 3]     = ox * disp;
          corePos[i * 3 + 1] = oy * disp;
          corePos[i * 3 + 2] = oz * disp;
        }
        coreGeometry.attributes.position.needsUpdate = true;

        // --- Deformación y Dispersión del Aura ---
        const auraPos = auraGeometry.attributes.position.array;
        for (let i = 0; i < AURA_COUNT; i++) {
          const ox = auraOriginal[i * 3];
          const oy = auraOriginal[i * 3 + 1];
          const oz = auraOriginal[i * 3 + 2];

          const noiseVal = noise3D(ox * 1.2 - time * 0.8, oy * 1.2, oz * 1.2 + time * 0.8);
          const disp = 1 + noiseVal * 0.35;

          auraPos[i * 3]     = ox * disp;
          auraPos[i * 3 + 1] = oy * disp;
          auraPos[i * 3 + 2] = oz * disp;
        }
        auraGeometry.attributes.position.needsUpdate = true;

        // Rotación continua e independiente para ambas capas
        corePoints.rotation.y = time * 0.25;
        corePoints.rotation.x = time * 0.12;

        auraPoints.rotation.y = -time * 0.15;
        auraPoints.rotation.z = Math.sin(time * 0.1) * 0.15;

        renderer.render(scene, camera);
      }

      animate();

      // ====================== RESIZE ======================
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
</body>
</html>
