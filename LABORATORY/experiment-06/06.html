<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core_FlowField_v4 — Pulsing Organic Sphere</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0A0A0A;
        }
        #flow-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="flow-canvas"></canvas>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
    </script>

    <script type="module">
      import * as THREE from 'three';

      // ====================== NOISE (Perlin 3D) ======================
      function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
      function lerp(a, b, t) { return a + t * (b - a); }
      function grad(hash, x, y, z) {
        const h = hash & 15;
        const u = h < 8 ? x : y;
        const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }
      const perm = new Uint8Array(512);
      const p = new Uint8Array(256);
      for (let i = 0; i < 256; i++) p[i] = i;
      for (let i = 255; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [p[i], p[j]] = [p[j], p[i]];
      }
      for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

      function noise3D(x, y, z) {
        const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
        x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
        const u = fade(x), v = fade(y), w = fade(z);
        const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
        const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
        return lerp(
          lerp(
            lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
            lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),
          lerp(
            lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
            lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v),
          w
        );
      }

      // ====================== SCENE SETUP ======================
      const canvas = document.getElementById('flow-canvas');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 6.2);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x0A0A0A, 1);

      function getRadius() {
        if (window.innerWidth < 768) return 1.15;
        else if (window.innerWidth < 1200) return 1.45;
        else return 1.70;
      }
      let RADIUS = getRadius();

      // ====================== PARTICLE SYSTEM ======================
      const COUNT = 18000;
      const positions = new Float32Array(COUNT * 3);
      const colors = new Float32Array(COUNT * 3);
      const life = new Float32Array(COUNT);

      // Paleta: Neón Verde Esmeralda -> Cian -> Azul -> Violeta
      const colorA = new THREE.Color(0x00FF87);
      const colorB = new THREE.Color(0x60EFFF);
      const colorC = new THREE.Color(0x0061FF);

      function spawnOnSphere(i) {
        const phi = Math.acos(1 - 2 * Math.random());
        const theta = Math.PI * 2 * Math.random();

        const x = Math.sin(phi) * Math.cos(theta);
        const y = Math.sin(phi) * Math.sin(theta);
        const z = Math.cos(phi);

        positions[i * 3]     = x * RADIUS;
        positions[i * 3 + 1] = y * RADIUS;
        positions[i * 3 + 2] = z * RADIUS;

        life[i] = Math.random() * 220 + 100;

        const t = (y + 1) * 0.5;
        let c = t < 0.5 
          ? colorA.clone().lerp(colorB, t * 2) 
          : colorB.clone().lerp(colorC, (t - 0.5) * 2);

        colors[i * 3]     = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      for (let i = 0; i < COUNT; i++) {
        spawnOnSphere(i);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.024,
        vertexColors: true,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);

      // ====================== ANIMATION LOOP ======================
      let time = 0;
      const noiseScale = 0.75;
      const speed = 0.013;

      const posVec = new THREE.Vector3();
      const normal = new THREE.Vector3();
      const flow = new THREE.Vector3();

      function animate() {
        requestAnimationFrame(animate);
        time += 0.0035;

        const pos = geometry.attributes.position.array;

        for (let i = 0; i < COUNT; i++) {
          const idx = i * 3;

          posVec.set(pos[idx], pos[idx + 1], pos[idx + 2]);

          // Vector dirección desde el origen
          normal.copy(posVec).normalize();

          // 1. Campo de Ruido para desplazamiento TANGENCIAL (Ondas)
          const nx = posVec.x * noiseScale;
          const ny = posVec.y * noiseScale;
          const nz = posVec.z * noiseScale;

          const n1 = noise3D(nx + time, ny, nz);
          const n2 = noise3D(nx, ny + time, nz);
          const n3 = noise3D(nx, ny, nz + time);

          flow.set(n1, n2, n3);
          flow.cross(normal).normalize().multiplyScalar(speed);

          posVec.add(flow);

          // 2. Pulsación y deformación RADIAL (Efecto "despegue/respiración")
          // Una onda global senoidal + capas de ruido local 3D
          const globalPulse = Math.sin(time * 1.5) * 0.12; 
          const localPulse1 = noise3D(nx * 1.2 + time * 0.8, ny * 1.2, nz * 1.2) * 0.35;
          const localPulse2 = noise3D(nx * 2.5 - time, ny * 2.5, nz * 2.5) * 0.15;

          // Radio variable dinámico
          const targetRadius = RADIUS * (1 + globalPulse + localPulse1 + localPulse2);

          // Ajustar la posición al nuevo radio deformado de forma orgánica
          posVec.normalize().multiplyScalar(targetRadius);

          pos[idx]     = posVec.x;
          pos[idx + 1] = posVec.y;
          pos[idx + 2] = posVec.z;

          // Reciclaje continuo de vida útil
          life[i] -= 1;
          if (life[i] <= 0) {
            spawnOnSphere(i);
          }
        }

        geometry.attributes.position.needsUpdate = true;

        particleSystem.rotation.y = time * 0.12;
        particleSystem.rotation.x = Math.sin(time * 0.09) * 0.07;

        renderer.render(scene, camera);
      }

      animate();

      // ====================== RESIZE ======================
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        RADIUS = getRadius();
      });
    </script>
</body>
</html>
