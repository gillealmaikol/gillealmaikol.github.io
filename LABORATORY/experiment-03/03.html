<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromashift Sphere — Dense Line Field</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0A0A0A;
        }
        #sphere-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="sphere-canvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ====================== NOISE — PERLIN 3D ======================
        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(a, b, t) { return a + t * (b - a); }
        function grad(hash, x, y, z) {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }

        const perm = new Uint8Array(512);
        const p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) p[i] = i;
        for (let i = 255; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [p[i], p[j]] = [p[j], p[i]];
        }
        for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

        function noise3D(x, y, z) {
            const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
            x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
            const u = fade(x), v = fade(y), w = fade(z);
            const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
            const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;

            return lerp(
                lerp(
                    lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
                    lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v
                ),
                lerp(
                    lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
                    lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v
                ),
                w
            );
        }

        // ====================== PALETA — FUEGO ORGÁNICO ======================
        const stops = [
            new THREE.Color(0x000000), // negro
            new THREE.Color(0x120304), // negro rojizo
            new THREE.Color(0x350508), // rojo oscuro
            new THREE.Color(0x6E0B0D), // carmesí oscuro
            new THREE.Color(0xA9160E), // rojo fuego
            new THREE.Color(0xD9340B), // rojo naranja
            new THREE.Color(0xF45B0A), // naranja
            new THREE.Color(0xFF8C16), // naranja cálido
            new THREE.Color(0xFFC52E), // amarillo fuego
            new THREE.Color(0xFFF1B0), // amarillo pálido
            new THREE.Color(0xFFFFFF), // blanco caliente
            new THREE.Color(0xFFF1B0), // amarillo pálido
            new THREE.Color(0xFFC52E), // amarillo
            new THREE.Color(0xFF8C16), // naranja
            new THREE.Color(0xE94A0B), // rojo naranja
            new THREE.Color(0x9C100C), // rojo profundo
            new THREE.Color(0x3A0507), // rojo casi negro
            new THREE.Color(0x000000)  // negro
        ];

        function sampleGradient(t) {
            t = Math.max(0, Math.min(1, t));
            const scaled = t * (stops.length - 1);
            const i = Math.floor(scaled);
            const f = scaled - i;
            return stops[i].clone().lerp(
                stops[Math.min(i + 1, stops.length - 1)],
                f
            );
        }

        // ====================== SCENE ======================
        const canvas = document.getElementById('sphere-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 6.2;

        const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: true,
            alpha: true
        });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x0A0A0A, 1);

        // ====================== OPTIMIZACIÓN RESPONSIVA ======================
        const isMobile = window.innerWidth < 768;

        function getRadius() {
            if (window.innerWidth < 768) return 1.15;
            if (window.innerWidth < 1200) return 1.45;
            return 1.70;
        }

        let RADIUS = getRadius();

        // En móvil reducimos la densidad para suavizar la carga de la CPU
        const MERIDIANS = isMobile ? 450 : 1800;
        const SEGMENTS = isMobile ? 110 : 220;

        const group = new THREE.Group();
        scene.add(group);

        const lines = [];

        for (let m = 0; m < MERIDIANS; m++) {
            const theta = (m / MERIDIANS) * Math.PI * 2;
            const positions = new Float32Array((SEGMENTS + 1) * 3);
            const colors = new Float32Array((SEGMENTS + 1) * 3);
            const original = new Float32Array((SEGMENTS + 1) * 3);

            for (let j = 0; j <= SEGMENTS; j++) {
                const phi = (j / SEGMENTS) * Math.PI;

                const x = Math.sin(phi) * Math.cos(theta);
                const y = Math.cos(phi);
                const z = Math.sin(phi) * Math.sin(theta);

                original[j * 3] = x;
                original[j * 3 + 1] = y;
                original[j * 3 + 2] = z;

                positions[j * 3] = x * RADIUS;
                positions[j * 3 + 1] = y * RADIUS;
                positions[j * 3 + 2] = z * RADIUS;

                const c = sampleGradient((y + 1) * 0.3);
                colors[j * 3] = c.r;
                colors[j * 3 + 1] = c.g;
                colors[j * 3 + 2] = c.b;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.LineBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity: isMobile ? 0.95 : 0.82, // Un poco más opaco en móvil para compensar la densidad
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const line = new THREE.Line(geometry, material);
            group.add(line);
            lines.push({ geometry, original });
        }

        // ====================== ANIMATION ======================
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.0045;

            for (let m = 0; m < lines.length; m++) {
                const { geometry, original } = lines[m];
                const pos = geometry.attributes.position.array;

                for (let j = 0; j <= SEGMENTS; j++) {
                    const ox = original[j * 3];
                    const oy = original[j * 3 + 1];
                    const oz = original[j * 3 + 2];

                    const n1 = noise3D(ox * 1.35 + time, oy * 1.35, oz * 1.35) * 0.30;
                    const n2 = noise3D(ox * 2.6 - time * 0.6, oy * 2.6, oz * 2.6) * 0.13;
                    const n3 = noise3D(ox * 0.65 + time * 0.25, oy * 0.65, oz * 0.65) * 0.20;

                    const displacement = 1 + n1 + n2 + n3;

                    pos[j * 3] = ox * RADIUS * displacement;
                    pos[j * 3 + 1] = oy * RADIUS * displacement;
                    pos[j * 3 + 2] = oz * RADIUS * displacement;
                }

                geometry.attributes.position.needsUpdate = true;
            }

            group.rotation.y = time * 0.12;
            group.rotation.x = Math.sin(time * 0.09) * 0.07;

            renderer.render(scene, camera);
        }

        animate();

        // ====================== RESIZE ======================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            RADIUS = getRadius();
        });
    </script>
</body>
</html>
