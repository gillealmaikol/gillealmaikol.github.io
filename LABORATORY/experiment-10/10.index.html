<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Glass — Chromatic Blob</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #04070D;
        }
        #canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ====================== SIMPLEX NOISE 3D ======================
        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(a, b, t) { return a + t * (b - a); }
        function grad(hash, x, y, z) {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }

        const perm = new Uint8Array(512);
        const p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) p[i] = i;
        for (let i = 255; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [p[i], p[j]] = [p[j], p[i]];
        }
        for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

        function noise3D(x, y, z) {
            const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
            x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
            const u = fade(x), v = fade(y), w = fade(z);
            const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
            const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;

            return lerp(
                lerp(
                    lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
                    lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v
                ),
                lerp(
                    lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
                    lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v
                ),
                w
            );
        }

        // ====================== GENERADOR DE TEXTURA HDRI EN VIVO ======================
        function createGradientEnvMap() {
            const canvasMap = document.createElement('canvas');
            canvasMap.width = 512;
            canvasMap.height = 256;
            const ctx = canvasMap.getContext('2d');

            // Degradado neón iridiscente
            const grad = ctx.createLinearGradient(0, 0, canvasMap.width, canvasMap.height);
            grad.addColorStop(0.0, '#00F0FF'); // Cian eléctrico
            grad.addColorStop(0.3, '#FF007F'); // Magenta
            grad.addColorStop(0.6, '#7B2CBF'); // Púrpura profundo
            grad.addColorStop(0.8, '#FFB703'); // Dorado cálido
            grad.addColorStop(1.0, '#02C39A'); // Verde esmeralda

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvasMap.width, canvasMap.height);

            const texture = new THREE.CanvasTexture(canvasMap);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }

        // ====================== SETUP ESCENA ======================
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 4.5;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const isMobile = window.innerWidth < 768;
        const RADIUS = isMobile ? 1.15 : 1.4;

        // Entorno de reflejos cromáticos
        const envTexture = createGradientEnvMap();
        scene.environment = envTexture;

        // ====================== ILUMINACIÓN MULTICOLOR ======================
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const light1 = new THREE.PointLight(0x00F0FF, 18, 12); // Cian
        light1.position.set(4, 3, 3);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xFF007F, 18, 12); // Magenta
        light2.position.set(-4, -3, -2);
        scene.add(light2);

        const light3 = new THREE.PointLight(0xFFD166, 15, 12); // Naranja/Dorado
        light3.position.set(0, 4, -3);
        scene.add(light3);

        // ====================== GEOMETRÍA Y CRISTAL IRIDISCENTE ======================
        const baseGeometry = new THREE.IcosahedronGeometry(RADIUS, isMobile ? 36 : 64);
        
        const posAttr = baseGeometry.attributes.position;
        const originalPositions = new Float32Array(posAttr.array.length);
        originalPositions.set(posAttr.array);

        // Material físico con iridiscencia y color volumétrico
        const material = new THREE.MeshPhysicalMaterial({
            color: 0x14213d,
            metalness: 0.0,
            roughness: 0.05,
            transmission: 0.92,             // Cristal ultrasuave
            ior: 1.45,                       // Refracción del vidrio
            reflectivity: 0.95,
            thickness: 1.5,
            
            // --- EFECTOS CROMÁTICOS IRIDISCENTES ---
            iridescence: 1.0,               // Reflejos tipo burbuja de aceite/cristal
            iridescenceIOR: 1.3,
            iridescenceThicknessRange: [100, 400],

            // --- COLOR INTERNO VOLUMÉTRICO ---
            attenuationColor: new THREE.Color(0xFF007F), // Violeta/Magenta interno
            attenuationDistance: 0.8,

            clearcoat: 1.0,
            clearcoatRoughness: 0.05
        });

        const glassMesh = new THREE.Mesh(baseGeometry, material);
        scene.add(glassMesh);

        // ====================== INTERACCIÓN MOUSE ======================
        let targetRotationX = 0;
        let targetRotationY = 0;

        window.addEventListener('pointermove', (e) => {
            const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;

            targetRotationY = mouseX * 0.6;
            targetRotationX = mouseY * 0.6;
        });

        // ====================== LOOP ANIMACIÓN ======================
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;

            // Deformación fluida de la gota
            const positions = baseGeometry.attributes.position.array;

            for (let i = 0; i < positions.length; i += 3) {
                const ox = originalPositions[i];
                const oy = originalPositions[i + 1];
                const oz = originalPositions[i + 2];

                const length = Math.sqrt(ox * ox + oy * oy + oz * oz);
                const nx = ox / length;
                const ny = oy / length;
                const nz = oz / length;

                const n = noise3D(ox * 0.85 + time * 0.35, oy * 0.85 + time * 0.25, oz * 0.85);
                const displacement = n * 0.38;

                positions[i]     = ox + nx * displacement;
                positions[i + 1] = oy + ny * displacement;
                positions[i + 2] = oz + nz * displacement;
            }

            baseGeometry.attributes.position.needsUpdate = true;
            baseGeometry.computeVertexNormals();

            // Rotación por interacción
            glassMesh.rotation.y += (targetRotationY - glassMesh.rotation.y) * 0.05;
            glassMesh.rotation.x += (targetRotationX - glassMesh.rotation.x) * 0.05;
            glassMesh.rotation.z = time * 0.04;

            // Movimiento dinámico de las luces
            light1.position.x = Math.sin(time * 0.8) * 4;
            light1.position.y = Math.cos(time * 0.6) * 3;
            light2.position.x = -Math.sin(time * 0.7) * 4;
            light2.position.z = Math.cos(time * 0.5) * 3;

            renderer.render(scene, camera);
        }

        animate();

        // ====================== RESIZE ======================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
