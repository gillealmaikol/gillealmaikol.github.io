<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volumetric Thread Swarm — B-Spline Sculptures</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #04070D;
        }
        #canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ====================== ENTORNO HDRI CROMÁTICO ======================
        function createEnvMap() {
            const canvasMap = document.createElement('canvas');
            canvasMap.width = 512;
            canvasMap.height = 256;
            const ctx = canvasMap.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, canvasMap.width, canvasMap.height);
            grad.addColorStop(0.0, '#7B2CBF'); // Violeta
            grad.addColorStop(0.5, '#FF007F'); // Magenta
            grad.addColorStop(1.0, '#10002B'); // Oscuro

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvasMap.width, canvasMap.height);

            const texture = new THREE.CanvasTexture(canvasMap);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }

        // ====================== SETUP ESCENA ======================
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        scene.environment = createEnvMap();

        // Luces para acentuar el relieve 3D de los hilos
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const light1 = new THREE.PointLight(0xFF007F, 12, 15);
        light1.position.set(5, 5, 5);
        scene.add(light1);

        const light2 = new THREE.PointLight(0x7B2CBF, 12, 15);
        light2.position.set(-5, -5, -2);
        scene.add(light2);

        // ====================== CREACIÓN DEL ENJAMBRE DE HILOS ======================
        const THREAD_COUNT = 35;       // Cantidad de listones/hilos
        const SEGMENTS_PER_THREAD = 24; // Puntos de control por curva
        const threads = [];
        const group = new THREE.Group();
        scene.add(group);

        const material = new THREE.MeshPhysicalMaterial({
            color: 0x9d4edd,
            metalness: 0.1,
            roughness: 0.1,
            transmission: 0.6,
            ior: 1.5,
            reflectivity: 0.9,
            iridescence: 1.0,
            iridescenceIOR: 1.3,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });

        for (let i = 0; i < THREAD_COUNT; i++) {
            const points = [];
            const radiusOffset = 0.5 + Math.random() * 1.5;
            const angleOffset = (i / THREAD_COUNT) * Math.PI * 2;

            for (let j = 0; j < SEGMENTS_PER_THREAD; j++) {
                const t = j / (SEGMENTS_PER_THREAD - 1);
                const y = (t - 0.5) * 4;
                const x = Math.cos(angleOffset + t * 3) * radiusOffset;
                const z = Math.sin(angleOffset + t * 3) * radiusOffset;
                points.push(new THREE.Vector3(x, y, z));
            }

            const curve = new THREE.CatmullRomCurve3(points);
            // TubeGeometry le da el volumen físico a la B-Spline
            const geometry = new THREE.TubeGeometry(curve, 64, 0.025, 8, false);
            const mesh = new THREE.Mesh(geometry, material);

            threads.push({
                mesh,
                curve,
                basePoints: points,
                speed: 0.2 + Math.random() * 0.3,
                phase: Math.random() * Math.PI * 2
            });

            group.add(mesh);
        }

        // ====================== INTERACCIÓN ======================
        let targetRotationX = 0;
        let targetRotationY = 0;

        window.addEventListener('pointermove', (e) => {
            const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;

            targetRotationY = mouseX * 0.5;
            targetRotationX = mouseY * 0.5;
        });

        // ====================== LOOP ANIMACIÓN ======================
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Deformación armónica de los puntos de control de cada hilo
            threads.forEach((thread, index) => {
                const points = thread.curve.points;

                for (let j = 0; j < points.length; j++) {
                    const base = thread.basePoints[j];
                    const waveX = Math.sin(time * thread.speed + j * 0.3 + thread.phase) * 0.4;
                    const waveZ = Math.cos(time * thread.speed * 0.8 + j * 0.4) * 0.4;

                    points[j].x = base.x + waveX;
                    points[j].z = base.z + waveZ;
                }

                // Reconstruimos la geometría de los tubos suavemente
                thread.mesh.geometry.dispose();
                thread.mesh.geometry = new THREE.TubeGeometry(thread.curve, 64, 0.025, 8, false);
            });

            // Rotación por inercia del ratón
            group.rotation.y += (targetRotationY - group.rotation.y) * 0.04;
            group.rotation.x += (targetRotationX - group.rotation.x) * 0.04;
            group.rotation.z = Math.sin(time * 0.2) * 0.1;

            renderer.render(scene, camera);
        }

        animate();

        // ====================== RESIZE ======================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
